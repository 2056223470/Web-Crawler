# 12306查询工具配置文件
base_url: 'https://kyfw.12306.cn/otn/leftTicket/queryR'
station_url: 'https://kyfw.12306.cn/otn/resources/js/framework/station_name.js?station_version=1.9338'
save_path: '../素材/12306/车站查询.csv'
timeout: 30
retry_attempts: 3
date_format: '%Y-%m-%d'
cache_dir: '.cache'
purpose_codes: 'ADULT'

# HTTP请求头
headers:
  Accept: 'application/json, text/javascript, */*; q=0.01'
  Accept-Language: 'zh-CN,zh;q=0.9,en;q=0.8'
  Cache-Control: 'no-cache'
  Connection: 'keep-alive'
  User-Agent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36'
  Cookie: '_uab_collina=174028924463462129025124; JSESSIONID=C458539200A553AA03D122C448AE82E9; _jc_save_wfdc_flag=dc;'

# CSV字段配置
csv_fields:
  - train_number
  - from_spot
  - to_spot
  - departure_time
  - seat_1
  - seat_2
  - seat_3
  - seat_4
  - seat_5
  - seat_6
  - seat_7
  - seat_8
  - seat_9
  - seat_10