# 优品PPT下载器配置文件
base_url: 'https://www.ypppt.com'
start_url: 'https://www.ypppt.com/moban'
save_path: '../素材/优品ppt'
csv_path: '../素材/优品ppt/ppt信息表.csv'
max_concurrent: 5
timeout: 30
retry_attempts: 3
